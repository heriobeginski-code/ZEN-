<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEN // Aurora Wellness Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --aurora-teal: #1de9b6;
            --aurora-blue: #2979ff;
            --aurora-violet: #651fff;
        }

        body {
            margin: 0;
            background: #05070a;
            color: white;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .holographic {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, #1de9b6, #2979ff, #651fff, #1de9b6);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: holo-flow 8s linear infinite;
        }

        @keyframes holo-flow {
            0% { background-position: 0%; }
            100% { background-position: 300%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card.active {
            background: rgba(29, 233, 182, 0.1);
            border-color: rgba(29, 233, 182, 0.5);
            box-shadow: 0 0 20px rgba(29, 233, 182, 0.2);
        }

        canvas#aurora {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(30px);
        }

        .lotus-container {
            transition: transform 4s ease-in-out;
        }

        .breathing-inhale { transform: scale(1.4); }
        .breathing-exhale { transform: scale(0.8); }

        textarea {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <canvas id="aurora"></canvas>

    <main class="relative z-10 h-screen w-full flex flex-col p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-4">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-teal-400">
                    <path d="M12 22C12 22 20 18 20 12C20 6 12 2 12 2C12 2 4 6 4 12C4 18 12 22 12 22Z"/>
                    <path d="M12 22V12M12 12L19 7M12 12L5 7"/>
                </svg>
                <h1 class="holographic text-xl font-bold">Zen Sanctuary</h1>
            </div>
            <div id="progress-bar" class="text-xs tracking-widest text-teal-200 opacity-70">RITUAL PROGRESS: 0%</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow">
            <div class="lg:col-span-2 grid grid-cols-2 sm:grid-cols-3 gap-4" id="ritual-grid">
                </div>

            <div class="flex flex-col gap-6">
                <div class="glass-card rounded-3xl p-8 flex flex-col items-center justify-center text-center">
                    <div id="lotus" class="lotus-container mb-6">
                        <svg width="80" height="80" viewBox="0 0 100 100" class="text-teal-300">
                            <path fill="currentColor" opacity="0.6" d="M50 20C50 20 30 40 30 60C30 80 50 90 50 90C50 90 70 80 70 60C70 40 50 20Z"/>
                            <path fill="currentColor" d="M50 30C50 30 35 45 35 60C35 75 50 85 50 85C50 85 65 75 65 60C65 45 50 30Z"/>
                        </svg>
                    </div>
                    <p id="breath-text" class="holographic text-sm">Tap to Begin Breath</p>
                    <button id="breath-btn" class="mt-4 px-6 py-2 border border-teal-500/30 rounded-full text-xs hover:bg-teal-500/10 transition">START BOX BREATH</button>
                </div>

                <div class="glass-card rounded-3xl p-6 flex-grow flex flex-col">
                    <h3 class="holographic text-xs mb-4">Daily Reflection</h3>
                    <textarea id="journal" class="w-full flex-grow text-teal-100 placeholder-teal-700/50 leading-relaxed" placeholder="What are you grateful for in this moment?"></textarea>
                </div>
            </div>
        </div>
    </main>

    <audio id="chime" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        // CONFIG & STATE
        const rituals = [
            { id: 'guasha', label: 'Gua Sha', icon: '✨' },
            { id: 'hair', label: 'Hair Care', icon: '🌿' },
            { id: 'nails', label: 'Clean Nails', icon: '💅' },
            { id: 'night', label: 'Night Mask', icon: '🌙' },
            { id: 'journal', label: 'Journaling', icon: '✍️' },
            { id: 'breath', label: 'Breathing', icon: '🌬️' }
        ];

        let activeRituals = JSON.parse(localStorage.getItem('zen_rituals')) || [];
        let breathState = 'idle'; // idle, inhale, hold, exhale
        let auroraSpeed = 0.002;
        let auroraIntensity = 0.3;

        // AURORA ENGINE (Canvas)
        const canvas = document.getElementById('aurora');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function drawAurora() {
            time += auroraSpeed;
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, width, height);

            const layers = 3;
            for (let l = 0; l < layers; l++) {
                ctx.beginPath();
                ctx.moveTo(0, height);
                
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#1de9b600');
                gradient.addColorStop(0.5, l === 0 ? '#1de9b666' : l === 1 ? '#2979ff66' : '#651fff66');
                gradient.addColorStop(1, '#651fff00');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 150;
                ctx.globalAlpha = auroraIntensity;

                for (let x = 0; x < width; x += 10) {
                    const y = (height * 0.4) + 
                              Math.sin(x * 0.002 + time + l) * 100 + 
                              Math.cos(x * 0.001 - time * 0.5) * 50;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            requestAnimationFrame(drawAurora);
        }

        // BREATHING LOGIC
        const breathBtn = document.getElementById('breath-btn');
        const lotus = document.getElementById('lotus');
        const breathText = document.getElementById('breath-text');

        function runBreathCycle() {
            if (breathState === 'idle') return;

            // Inhale
            breathState = 'inhale';
            breathText.innerText = "Inhale...";
            lotus.className = 'lotus-container breathing-inhale';
            auroraSpeed = 0.01; auroraIntensity = 0.8;
            
            setTimeout(() => {
                // Hold
                breathText.innerText = "Hold...";
                setTimeout(() => {
                    // Exhale
                    breathState = 'exhale';
                    breathText.innerText = "Exhale...";
                    lotus.className = 'lotus-container breathing-exhale';
                    auroraSpeed = 0.001; auroraIntensity = 0.2;
                    
                    setTimeout(() => {
                        breathText.innerText = "Hold...";
                        setTimeout(runBreathCycle, 4000);
                    }, 4000);
                }, 4000);
            }, 4000);
        }

        breathBtn.addEventListener('click', () => {
            if (breathState === 'idle') {
                breathState = 'active';
                breathBtn.innerText = "STOP SESSION";
                runBreathCycle();
            } else {
                location.reload(); // Simple reset
            }
        });

       // 1. UPDATED RITUALS ARRAY WITH IMAGE PATHS
const rituals = [
    { id: 'guasha', label: 'Gua Sha', img: 'assets/guasha.jpg' },
    { id: 'hair', label: 'Hair Care', img: 'assets/hair.jpg' },
    { id: 'nails', label: 'Clean Nails', img: 'assets/nails.jpg' },
    { id: 'night', label: 'Night Routine', img: 'assets/night.jpg' },
    { id: 'journal', label: 'Journaling', img: 'assets/journal.jpg' },
    { id: 'breath', label: 'Breathing', img: 'assets/breath.jpg' }
];

// 2. UPDATED UI INJECTION (Supports High-End Card Visuals)
function initUI() {
    const grid = document.getElementById('ritual-grid');
    rituals.forEach(r => {
        const isActive = activeRituals.includes(r.id);
        const tile = document.createElement('div');
        
        // Dynamic Glass Card Template
        tile.className = `glass-card relative overflow-hidden rounded-3xl p-4 flex flex-col items-center justify-end h-48 cursor-pointer group transition-all duration-500 ${isActive ? 'active' : ''}`;
        
        tile.innerHTML = `
            <div class="absolute inset-0 z-0 opacity-40 group-hover:opacity-60 group-hover:scale-110 transition-all duration-700">
                <img src="${r.img}" alt="${r.label}" class="w-full h-full object-cover grayscale-[20%] brightness-[80%]">
            </div>
            
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent z-1"></div>

            <div class="relative z-10 text-[10px] uppercase tracking-[0.2em] font-bold text-teal-100 group-hover:text-white transition-colors">
                ${r.label}
            </div>
            
            <div class="absolute top-4 right-4 z-10 transition-opacity duration-300 ${isActive ? 'opacity-100' : 'opacity-0'}">
                <div class="w-2 h-2 rounded-full bg-teal-400 shadow-[0_0_10px_#1de9b6]"></div>
            </div>
        `;
        
        tile.onclick = () => toggleRitual(r.id, tile);
        grid.appendChild(tile);
    });

    // Journal persistence
    const journal = document.getElementById('journal');
    journal.value = localStorage.getItem('zen_journal') || '';
    journal.oninput = (e) => localStorage.setItem('zen_journal', e.target.value);

    updateProgress();
}

        function toggleRitual(id, el) {
            document.getElementById('chime').play();
            if (activeRituals.includes(id)) {
                activeRituals = activeRituals.filter(i => i !== id);
                el.classList.remove('active');
            } else {
                activeRituals.push(id);
                el.classList.add('active');
            }
            localStorage.setItem('zen_rituals', JSON.stringify(activeRituals));
            updateProgress();
        }

        function updateProgress() {
            const progress = (activeRituals.length / rituals.length);
            document.getElementById('progress-bar').innerText = `RITUAL PROGRESS: ${Math.round(progress * 100)}%`;
            
            // Dashboard Handshake
            window.parent.postMessage({ 
                type: 'UPDATE_PROGRESS', 
                appId: 'zen-05', 
                value: progress 
            }, '*');
        }

        // INITIALIZE
        window.addEventListener('resize', resize);
        resize();
        initUI();
        drawAurora();

    </script>
</body>
</html>
